<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#14111c" />
    <title>무사의 길 - 전사 키우기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0d0b12; overflow: hidden;
        touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
      body.training #game { position: fixed; inset: 0; }
      body.training #hud, body.training #panel { display: none; }
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #14111c; color: #e9d9b4;
        font-family: 'Noto Serif KR', serif; align-items: center; justify-content: center; flex-direction: column; text-align: center; }
      #rotate .icon { font-size: 56px; margin-bottom: 12px; animation: tilt 1.6s ease-in-out infinite; }
      @keyframes tilt { 0%,100% { transform: rotate(0) } 50% { transform: rotate(90deg) } }
      @media (orientation: portrait) and (pointer: coarse) { body.training #rotate { display: flex; } }
      #error { position: fixed; inset: 0; z-index: 20; background: rgba(20,10,10,.96); color: #ffd9d0; padding: 24px;
        font: 14px/1.6 monospace; overflow: auto; white-space: pre-wrap; }
      #error h2 { color: #ff7a66; font-family: sans-serif; margin-top: 0; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="battle-col">
        <div id="battle-wrap">
          <div id="game"></div>
          <div id="hud"></div>
        </div>
      </div>
      <div id="panel"></div>
    </div>
    <div id="rotate"><div class="icon">📱</div><div>기기를 가로로 돌려주세요</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
